spring.application.name=tikiscore-server
spring.profiles.default=dev
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/tikiscore}
spring.datasource.username=${DATABASE_USERNAME:tikiscore}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.show-sql=${HIBERNATE_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false
